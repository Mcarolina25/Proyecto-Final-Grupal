# Archivo para orqustar los contenedores YpDAnRMkmYRMHSD6dmCOhG2xaJEcSmM_yTN_nmXn-pE=
# Flujo de Arranque desde la terminal de Docker o VSC parados en la raiz del docker:
# 1.	Levantamos el init: docker compose up airflow-init
# 2.	Levantamos el resto (airflow-webserver y airflow-scheduler): docker compose up
# -.	Para parar los contenedores: docker compose down
# -.	Para ver los logs de un contenedor: docker compose logs -f <nombre_contenedor>
# -.	Para ver los contenedores activos: docker compose ps
# -.	Para ver los contenedores detenidos: docker compose ps -a
# -.	Para ver los volúmenes: docker volume ls
# -.	Para borrar los volúmenes: docker volume rm <nombre_volumen>
# -.	Para borrar las imágenes: docker image rm <nombre_imagen>
# -.	Para borrar los contenedores: docker container rm <nombre_contenedor>
# -.	Para borrar los networks: docker network rm <nombre_network>
# -.	Para borrar los build: docker build --no-cache -t
# -.	Detener y eliminar contenedores: docker compose down
# -.	Para limpiar los volúmenes: docker compose down --volumes
# -.	Para limpiar las imágenes: docker image prune -a
# -.	Para borrar los contenedores: docker container prune
# -.	Para borrar los networks: docker network prune


version: '3.8'
services:
  db:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  ml:
    build: 
      context: .
      dockerfile: ./services/ml/Dockerfile.ml
    container_name: ml_service
    depends_on:
      - db
    environment:
      # Variables para conectar con la DB
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypass
      POSTGRES_DB: mydatabase
    volumes:
      - ./services/ml/scripts:/app/scripts
      - ./data:/app/data

volumes:
  postgres_data:
